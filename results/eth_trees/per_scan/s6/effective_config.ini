# effective configuration  ([UNSPECIFIED] = 論文未指定, chosen by us)

[budget]
abs_tol = 1    # budget match absolute tolerance [points]
d0_hi = 1000    # 
d0_lo = 0.1    # physical d0 search range [m]
intercept_hi = 1    # 
intercept_lo = -0.5    # linear intercept search range
max_iter = 60    # bisection iterations
rel_tol = 0.001    # budget match relative tolerance

[cluster]
max_points = 10000000    # [UNSPECIFIED] max cluster size
min_points = 30    # [UNSPECIFIED] min cluster size
tolerance = 0.1    # [UNSPECIFIED] Euclidean clustering distance [m]

[cylinder]
check_arc_coverage = true    # [UNSPECIFIED] OUR ADDITION (not in paper): enable arc-coverage check
check_normal_consistency = true    # [UNSPECIFIED] OUR ADDITION (not in paper): enable normal-consistency check
dist_threshold = 0.02    # [UNSPECIFIED] RANSAC inlier distance [m]
fixed_seed = 12345    # used when seed_mode = fixed
lm_passes = 2    # [UNSPECIFIED] IMPLEMENTATION CHOICE: LM refit passes on geometric inliers
lm_refit = true    # [UNSPECIFIED] Levenberg-Marquardt refit (task spec, not in paper)
max_iterations = 1000    # [UNSPECIFIED] RANSAC max iterations
max_tilt_deg = 20    # [UNSPECIFIED] post-fit axis tilt check [deg]
min_arc_deg = 100    # [UNSPECIFIED] min angular coverage of geometric inliers around the axis [deg] (5-degree bins)
min_inlier_ratio = 0.5    # [UNSPECIFIED] post-fit inlier ratio check; IMPLEMENTATION CHOICE: inliers counted by geometric point-to-surface distance
min_normal_ratio = 0.75    # [UNSPECIFIED] normal consistency: min fraction of points within normal_max_angle_deg
min_points = 30    # [UNSPECIFIED] clusters smaller than this are not fitted
normal_max_angle_deg = 30    # [UNSPECIFIED] normal consistency: max angle between point normal and fitted surface normal [deg]
normal_weight = 0.1    # [UNSPECIFIED] RANSAC normal distance weight
probability = 0.99    # [UNSPECIFIED] RANSAC success probability (adaptive stop)
radius_max = 1    # [UNSPECIFIED] post-fit radius check [m]
radius_min = 0.03    # [UNSPECIFIED] post-fit radius check [m]
seed_mode = follow    # follow | fixed

[dtm]
cell = 0.5    # [UNSPECIFIED] DTM grid cell size [m]
fill_max_radius = 5    # [UNSPECIFIED] max window half width when filling [cells]
fit_radius = 2    # [UNSPECIFIED] plane-fit window half width [cells]
ground_select = supported_lowest    # [UNSPECIFIED] IMPLEMENTATION CHOICE: supported_lowest (default; lowest point with support_count points within support_dz above) | percentile (k-th percentile, kept for comparison)
min_points = 3    # [UNSPECIFIED] min points per cell for a ground sample
outlier_above = 0.5    # [UNSPECIFIED] reject ground samples above neighbour plane + this [m]
percentile = 5    # [UNSPECIFIED] k-th percentile of z per cell
support_count = 3    # [UNSPECIFIED] supported_lowest: required points above the candidate
support_dz = 0.05    # [UNSPECIFIED] supported_lowest: height window above the candidate [m]

[experiment]
match_radius = 0.5    # reference matching radius [m]
n_seeds = 10    # seeds per version
profiles = both    # cm_compare: both | baseline (extra checks off) | improved (extra checks on)
seed_base = 1    # first seed

[height]
neg_tol = 0.05    # [UNSPECIFIED] negative tolerance below zmin [m]
zmax = 3    # paper: 3 m
zmin = 0    # paper: 0 m

[intersect]
max_iter = 50    # [UNSPECIFIED] 
scan_step = 0.1    # [UNSPECIFIED] bracket scan step [m]
search_range = 5    # [UNSPECIFIED] bracket half-range along axis [m]
tol = 0.001    # [UNSPECIFIED] axis/DTM intersection tolerance [m]

[normals]
min_neighbors = 5    # [UNSPECIFIED] min neighbours for PCA
octree_res = 0.05    # [UNSPECIFIED] octree resolution [m]
radius = 0.1    # paper: 10 cm
vert_threshold = 0.9    # paper: verticality > 0.9 (0.8 = optional, NOT the paper setting)

[retention]
hash_quantum = 0.0001    # coordinate quantum for per-point hash [m]
linear_slope = 0.05    # our modification: 0.05 / m
physical_d0 = 10    # our modification: d0 [m]
physical_pmin = 0.1    # our modification: P_min
version = step    # step | linear_a | linear_mid | physical

[scanner]
max_local_coord = 10000    # [UNSPECIFIED] error if |local coord| exceeds this [m]
nearest_warn = 3    # [UNSPECIFIED] warn if nearest point farther than this [m]
use_3d_distance = false    # d = 3-D instead of horizontal distance
x0 = 0    # [UNSPECIFIED] scanner x in original coordinates (default assumes origin)
y0 = 0    # [UNSPECIFIED] scanner y
z0 = 0    # [UNSPECIFIED] scanner z

[voxel]
leaf = 0.01    # paper: 1 cm, keep original point nearest to voxel centroid
# scanner.position_given = true
